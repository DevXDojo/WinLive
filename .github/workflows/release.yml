name: Store Release
run-name: Store release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store package version, for example 1.2.3
        required: true
        type: string
      publish:
        description: Submit the package to Microsoft Store
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  store-release:
    name: Build and optionally submit Store MSIX
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
      PACKAGE_IDENTITY_NAME: ${{ vars.WINDOWS_PACKAGE_IDENTITY_NAME }}
      PACKAGE_PUBLISHER: ${{ vars.WINDOWS_PACKAGE_PUBLISHER }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Store package version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:INPUT_VERSION.Trim()
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }

          $pattern = '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$'
          if ($version -notmatch $pattern) {
            throw "'$version' is not a supported Store package version. Use a stable version such as 1.2.3."
          }

          $major = [int] $Matches.major
          $minor = [int] $Matches.minor
          $patch = [int] $Matches.patch
          if ($major -gt 65534 -or $minor -gt 65534 -or $patch -gt 65534) {
            throw 'Each numeric version component must be between 0 and 65534 for .NET.'
          }

          $packageVersion = "$major.$minor.$patch.0"
          "version=$version" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore WinLive.sln -p:Platform=x64

      - name: Run tests
        run: dotnet test WinLive.sln --configuration Release -p:Platform=x64 --no-restore

      - name: Set Store package identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'src\WinLive\Package.appxmanifest'
          [xml] $manifest = Get-Content -LiteralPath $manifestPath -Raw

          if (-not [string]::IsNullOrWhiteSpace($env:PACKAGE_IDENTITY_NAME)) {
            $manifest.Package.Identity.Name = $env:PACKAGE_IDENTITY_NAME
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PACKAGE_PUBLISHER)) {
            $manifest.Package.Identity.Publisher = $env:PACKAGE_PUBLISHER
          }

          $manifest.Package.Identity.Version = $env:PACKAGE_VERSION
          $manifest.Save($manifestPath)

      - name: Build unsigned MSIX package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\store-release-msix\'

          dotnet build 'src\WinLive\WinLive.csproj' `
            --configuration Release `
            --no-restore `
            "-p:Version=$env:VERSION" `
            "-p:AssemblyVersion=$env:PACKAGE_VERSION" `
            "-p:FileVersion=$env:PACKAGE_VERSION" `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            "-p:AppxPackageDir=$packageDir"

      - name: Collect Store package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msixFiles = @(Get-ChildItem 'artifacts\store-release-msix' -Recurse -Filter '*.msix')
          if ($msixFiles.Count -ne 1) {
            throw "Expected exactly one MSIX package, found $($msixFiles.Count)."
          }

          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\store-release'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $fileName = "WinLive-$env:VERSION-store-windows-x64.msix"
          $outputPath = Join-Path $outputDir $fileName
          Copy-Item -LiteralPath $msixFiles[0].FullName -Destination $outputPath

          $hash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashPath = "$outputPath.sha256"
          "$hash *$fileName" | Set-Content -LiteralPath $hashPath -Encoding ascii

          "asset_path=$outputPath" >> $env:GITHUB_OUTPUT

      - name: Upload Store package artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinLive-${{ steps.version.outputs.version }}-store-windows-x64
          path: artifacts/store-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Configure Microsoft Store CLI
        if: ${{ inputs.publish }}
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit package to Microsoft Store
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          PACKAGE_PATH: ${{ steps.package.outputs.asset_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:STORE_PRODUCT_ID)) {
            throw 'Repository variable STORE_PRODUCT_ID is required when publish is true.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_AD_TENANT_ID)) {
            throw 'Repository secret AZURE_AD_TENANT_ID is required when publish is true.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_AD_APPLICATION_CLIENT_ID)) {
            throw 'Repository secret AZURE_AD_APPLICATION_CLIENT_ID is required when publish is true.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_AD_APPLICATION_SECRET)) {
            throw 'Repository secret AZURE_AD_APPLICATION_SECRET is required when publish is true.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SELLER_ID)) {
            throw 'Repository secret SELLER_ID is required when publish is true.'
          }

          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

          msstore publish $env:PACKAGE_PATH -id $env:STORE_PRODUCT_ID
