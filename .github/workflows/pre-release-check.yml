name: Store Package Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-package-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Test and build unsigned Store MSIX
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore WinLive.sln -p:Platform=x64

      - name: Run tests
        run: dotnet test WinLive.sln --configuration Release -p:Platform=x64 --no-restore

      - name: Set CI package identity
        shell: pwsh
        env:
          PACKAGE_IDENTITY_NAME: ${{ vars.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PACKAGE_PUBLISHER: ${{ vars.WINDOWS_PACKAGE_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'src\WinLive\Package.appxmanifest'
          [xml] $manifest = Get-Content -LiteralPath $manifestPath -Raw

          if (-not [string]::IsNullOrWhiteSpace($env:PACKAGE_IDENTITY_NAME)) {
            $manifest.Package.Identity.Name = $env:PACKAGE_IDENTITY_NAME
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PACKAGE_PUBLISHER)) {
            $manifest.Package.Identity.Publisher = $env:PACKAGE_PUBLISHER
          }

          $manifest.Package.Identity.Version = '0.0.0.0'
          $manifest.Save($manifestPath)

      - name: Build unsigned MSIX package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\store-check-msix\'

          dotnet build 'src\WinLive\WinLive.csproj' `
            --configuration Release `
            --no-restore `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            "-p:AppxPackageDir=$packageDir"

      - name: Collect package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msixFiles = @(Get-ChildItem 'artifacts\store-check-msix' -Recurse -Filter '*.msix')
          if ($msixFiles.Count -ne 1) {
            throw "Expected exactly one MSIX package, found $($msixFiles.Count)."
          }

          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\store-check'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $outputPath = Join-Path $outputDir 'WinLive-store-check-windows-x64.msix'
          Copy-Item -LiteralPath $msixFiles[0].FullName -Destination $outputPath

          $hash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *WinLive-store-check-windows-x64.msix" | Set-Content `
            -LiteralPath (Join-Path $outputDir 'WinLive-store-check-windows-x64.msix.sha256') `
            -Encoding ascii

      - name: Upload checked Store package
        uses: actions/upload-artifact@v4
        with:
          name: WinLive-store-package-check-${{ github.run_number }}
          path: artifacts/store-check/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
